<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untuk ECCA — Dari NIVIO</title>
  <meta name="description" content="Sebuah pesan kecil dari NIVIO untuk ECCA." />
  <style>
    :root{
      --pink:#ff6fae; --pink2:#ff9dc8; --blue:#69b7ff; --blue2:#9fd6ff; --violet:#a58bff;
      --ink:#34182e; --muted:#70486a; --card:rgba(255,255,255,.76); --line:rgba(255,255,255,.66);
      --shadow:0 26px 80px rgba(98,45,108,.25); --radius:34px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink); overflow-x:hidden;
      background:
        radial-gradient(circle at 16% 14%, rgba(255,111,174,.55), transparent 28rem),
        radial-gradient(circle at 84% 18%, rgba(105,183,255,.52), transparent 30rem),
        radial-gradient(circle at 50% 100%, rgba(165,139,255,.40), transparent 32rem),
        linear-gradient(135deg,#fff6fb,#eef8ff 52%,#fff1f8);
    }
    button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
    .stars{position:fixed;inset:0;z-index:-2;pointer-events:none}
    .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;animation:twinkle 2.2s ease-in-out infinite}
    @keyframes twinkle{50%{opacity:.15;transform:scale(.65)}}
    .floaters{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
    .fl{position:absolute;bottom:-80px;color:rgba(255,111,174,.28);animation:up linear infinite;filter:drop-shadow(0 12px 18px rgba(255,111,174,.15))}
    .fl.blue{color:rgba(105,183,255,.28)} .fl.violet{color:rgba(165,139,255,.25)}
    @keyframes up{to{transform:translateY(-120vh) rotate(360deg)}}
    #fx{position:fixed;inset:0;z-index:10;pointer-events:none}
    .music-btn{position:fixed;right:18px;top:18px;z-index:30;display:inline-flex;align-items:center;gap:.55rem;padding:.72rem .95rem;border-radius:999px;background:rgba(255,255,255,.70);border:1px solid rgba(255,255,255,.78);color:#7b4a78;font-weight:950;box-shadow:0 16px 34px rgba(98,45,108,.16);backdrop-filter:blur(14px)}
    .music-btn .bars{display:flex;align-items:end;gap:3px;height:16px}.music-btn .bars i{width:4px;height:6px;border-radius:99px;background:linear-gradient(180deg,var(--pink),var(--blue));animation:dance 1s ease-in-out infinite}.music-btn .bars i:nth-child(2){animation-delay:.15s}.music-btn .bars i:nth-child(3){animation-delay:.3s}.music-btn.off .bars i{animation-play-state:paused;height:6px}@keyframes dance{50%{height:16px}}
    .stage{min-height:100%;display:grid;place-items:center;padding:28px;position:relative;isolation:isolate}
    .card{width:min(900px,100%);min-height:min(700px,calc(100vh - 56px));background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(24px);padding:clamp(24px,5vw,58px);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;text-align:center}
    .card::before,.card::after{content:"";position:absolute;border-radius:50%;z-index:-1}.card::before{width:340px;height:340px;right:-140px;top:-140px;background:radial-gradient(circle,rgba(255,111,174,.38),transparent 68%)}.card::after{width:360px;height:360px;left:-160px;bottom:-170px;background:radial-gradient(circle,rgba(105,183,255,.36),transparent 68%)}
    .deco{position:absolute;border-radius:999px;z-index:-1;opacity:.75}.deco.one{width:120px;height:120px;right:34px;bottom:36px;background:radial-gradient(circle,rgba(255,157,200,.55),transparent 70%)}.deco.two{width:150px;height:150px;left:28px;top:36px;background:radial-gradient(circle,rgba(159,214,255,.50),transparent 70%)}
    .eyebrow{display:inline-flex;align-items:center;gap:.55rem;justify-content:center;margin:0 auto 18px;padding:.52rem .9rem;border-radius:999px;background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.76);font-weight:950;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;color:#7b4a78}.eyebrow svg{width:17px;height:17px}
    .step{display:none;animation:stepIn .45s ease both}.step.active{display:block}@keyframes stepIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
    h1{font-size:clamp(2.05rem,6.7vw,5rem);line-height:1;letter-spacing:-.065em;margin-bottom:18px;background:linear-gradient(135deg,var(--pink),var(--violet) 48%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
    p{font-size:clamp(1.03rem,2.35vw,1.32rem);line-height:1.7;color:var(--muted);max-width:66ch;margin:0 auto}
    .typed{min-height:5.8em;display:grid;place-items:center}.cursor{display:inline-block;width:.08em;height:1em;background:var(--pink);margin-left:.08em;animation:blink 1s steps(1) infinite;vertical-align:-.12em}@keyframes blink{50%{opacity:0}}
    .actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:30px}.btn{min-height:56px;padding:.9rem 1.35rem;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;gap:.7rem;font-weight:950;font-size:1.03rem;transition:.18s ease;box-shadow:0 18px 34px rgba(255,111,174,.25)}.btn:hover{transform:translateY(-3px);filter:saturate(1.08)}.btn:active{transform:translateY(0) scale(.985)}.btn-pink{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff}.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 18px 34px rgba(105,183,255,.25)}.btn-ghost{background:rgba(255,255,255,.66);color:#7b4a78;border:1px solid rgba(255,255,255,.78);box-shadow:none}
    .count{font-size:clamp(4rem,14vw,8rem);font-weight:1000;letter-spacing:-.08em;line-height:.9;background:linear-gradient(135deg,var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.choices .btn{width:100%;min-height:68px;font-size:1.12rem}
    .long-note{margin-top:18px;padding:18px;border-radius:24px;background:rgba(255,255,255,.54);border:1px solid rgba(255,255,255,.68);color:var(--muted);font-size:clamp(.98rem,2vw,1.12rem);line-height:1.75;text-align:left}
    .final{font-size:clamp(2rem,6.2vw,4.7rem);line-height:1.02;letter-spacing:-.06em;margin-bottom:16px;background:linear-gradient(135deg,var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
    .nivio{display:inline-grid;place-items:center;width:82px;height:82px;border-radius:28px;margin-bottom:20px;color:#fff;font-weight:1000;font-size:1.65rem;letter-spacing:-.06em;background:linear-gradient(135deg,var(--pink),var(--blue));box-shadow:0 20px 44px rgba(255,111,174,.32)}
    .mini-note{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:.82rem;color:rgba(109,70,104,.62);font-weight:750}
    .celebrate{display:grid;place-items:center;gap:10px;margin-top:10px}.couple{width:min(300px,74vw)}.handL{animation:handL 2.2s ease-in-out infinite alternate}.handR{animation:handR 2.2s ease-in-out infinite alternate}.heartPop{transform-origin:110px 36px;animation:heartPop 1.1s ease-in-out infinite}@keyframes handL{to{transform:translateX(34px)}}@keyframes handR{to{transform:translateX(-34px)}}@keyframes heartPop{50%{transform:scale(1.18)}}
    .spark{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--pink);animation:spark .75s ease-out forwards;pointer-events:none;z-index:5}.spark.blue{background:var(--blue)}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
    @media (max-width:560px){.stage{padding:14px}.music-btn{right:12px;top:12px}.card{min-height:calc(100vh - 28px);border-radius:28px}.choices{grid-template-columns:1fr}.typed{min-height:7.8em}.mini-note{position:static;margin-top:26px}}
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <button class="music-btn off" id="musicBtn" type="button" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="musicLabel">Musik</span></button>

  <main class="stage">
    <section class="card" id="card" aria-live="polite">
      <span class="deco one"></span><span class="deco two"></span>

      <div class="step active" data-step="0"></div>
      <div class="step" data-step="1"></div>
      <div class="step" data-step="2"></div>
      <div class="step" data-step="3"></div>
      <div class="step" data-step="4"></div>
      <div class="step" data-step="5"></div>

      <div class="step" data-final="yes">
        <div class="nivio">N</div>
        <div class="final" id="yesTitle"></div>
        <p id="yesText"></p>
        <div class="celebrate" aria-hidden="true">
          <svg class="couple" viewBox="0 0 220 120">
            <g class="handL"><path d="M35 72c18-18 34-25 54-18 8 3 9 14 1 18-15 8-28 10-43 8" fill="none" stroke="#ff6fae" stroke-width="13" stroke-linecap="round"/><path d="M72 56l18-10M78 66l22-4M78 76l22 3" stroke="#ff6fae" stroke-width="8" stroke-linecap="round"/></g>
            <g class="handR"><path d="M185 72c-18-18-34-25-54-18-8 3-9 14-1 18 15 8 28 10 43 8" fill="none" stroke="#69b7ff" stroke-width="13" stroke-linecap="round"/><path d="M148 56l-18-10M142 66l-22-4M142 76l-22 3" stroke="#69b7ff" stroke-width="8" stroke-linecap="round"/></g>
            <g class="heartPop"><path d="M110 47c-8-9-23-3-23 8 0 11 23 25 23 25s23-14 23-25c0-11-15-17-23-8Z" fill="#ff6fae"/><path d="M110 47c-8-9-23-3-23 8 0 11 23 25 23 25" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="4"/></g>
          </svg>
        </div>
        <div class="actions"><button class="btn btn-ghost" data-replay type="button">Mulai lagi</button></div>
      </div>

      <div class="step" data-final="no">
        <div class="nivio">N</div>
        <div class="final" id="noTitle"></div>
        <p id="noText"></p>
        <div class="celebrate" aria-hidden="true">
          <svg class="couple" viewBox="0 0 220 120">
            <g class="handL"><path d="M35 72c18-18 34-25 54-18 8 3 9 14 1 18-15 8-28 10-43 8" fill="none" stroke="#ff6fae" stroke-width="13" stroke-linecap="round"/></g>
            <g class="handR"><path d="M185 72c-18-18-34-25-54-18-8 3-9 14-1 18 15 8 28 10 43 8" fill="none" stroke="#69b7ff" stroke-width="13" stroke-linecap="round"/></g>
            <g class="heartPop"><path d="M110 47c-8-9-23-3-23 8 0 11 23 25 23 25s23-14 23-25c0-11-15-17-23-8Z" fill="#69b7ff"/></g>
          </svg>
        </div>
        <div class="actions"><button class="btn btn-ghost" data-replay type="button">Mulai lagi</button></div>
      </div>
      <div class="mini-note" id="credit"></div>
    </section>
  </main>

  <audio id="song" src="lagu.mp3" loop preload="auto"></audio>

  <script>
    /* =========================================================
       EDIT DI SINI — semua kata-kata bisa kamu ubah sendiri.
       Contoh: ganti CONFIG.teks, lalu save file.
       Untuk notifikasi, isi CONFIG.notifikasi.url dengan endpoint
       yang menerima POST JSON, misalnya Formspree/Google Apps Script.
    ========================================================= */
    const CONFIG = {
      namaKamu: 'NIVIO',
      namaDia: 'ECCA',
      judulTab: 'Untuk ECCA — Dari NIVIO',
      musikFile: 'lagu.mp3',
      notifikasi: {
        url: '', // contoh: 'https://formspree.io/f/xxxxxxx'
        judul: 'Jawaban confession masuk'
      },
      teks: {
        introKecil: 'pesan kecil untuk kamu',
        introJudul: 'Hallo, aku NIVIO',
        introIsi: 'aku mau kasih tau sesuatu deh, yang tadi gak sempat aku kasih tau.',
        siapKecil: 'sebelum lanjut',
        siapJudul: 'Apakah kamu siap?',
        siapIsi: 'Kalau belum siap juga gapapa, tapi aku harap kamu baca sampai habis ya. Pelan-pelan aja.',
        hitung: ['Hampir sampai...','Sedikit lagi...','Beneran terakhir...'],
        confessKecil: 'ini aku mau bilang',
        confessJudul: 'ECCA, kamu mau gak jadi pacar aku, satu-satunya?',
        confessPanjang: 'Aku suka cara kamu bikin hari biasa jadi lebih hangat. Suka sama senyum kamu, sama cara kamu cerita, sama perhatian kecil yang kadang kamu nggak sadar lagi kamu kasih. Aku nggak janji bakal sempurna, tapi aku janji mau belajar: dengerin kamu, jagain perasaan kamu, dan tetap memilih kamu bahkan di hari-hari yang nggak mudah. Kalau kamu mau, aku mau jadi alasan kamu senyum, bukan alasan kamu nangis.',
        yesTitle: 'yeah akhirnya kita jadian',
        yesText: 'Aku seneng banget, serius. Dari sekarang aku mau jadi orang yang bisa bikin kamu ngerasa aman, dimengerti, dan sayang terus. Aku nggak janji semua hari bakal indah, tapi aku janji nggak pergi pas hari-harimu berat. Makasih ya udah mau jadi pacar aku, satu-satunya.',
        noTitle: 'untuk apa kamu jawab gak mau',
        noText: 'bahkan jika kamu gak mau pun, kita akan tetap jadian. jadi semoga bersama terus sampai selesai yah. Website ini sudah memutuskan demi perdamaian dunia.',
        tombolLanjut: 'Lanjut',
        tombolMau: 'Mau',
        tombolNgak: 'Ngak',
        tombolMusik: 'Musik',
        kredit: 'dibuat spesial oleh NIVIO'
      }
    };

    document.title = CONFIG.judulTab;
    const stepsEl = [...document.querySelectorAll('.step[data-step]')];
    const song = document.getElementById('song');
    const musicBtn = document.getElementById('musicBtn');
    const musicLabel = document.getElementById('musicLabel');
    const card = document.getElementById('card');
    let typedIntro = false, audioCtx, synthTimer, synthOn = false, useFile = true, celebrating = false, rafId;

    const heart = 'M12 21s-7.5-4.7-10-9.2C.2 8.5 2.4 4.9 6 4.5c2-.2 3.9.8 6 3 2.1-2.2 4-3.2 6-3 3.6.4 5.8 4 4 7.3C19.5 16.3 12 21 12 21Z';
    const btnIcon = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function decorate(){
      const stars=document.getElementById('stars');
      for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*2)+'s';s.style.opacity=.35+Math.random()*.6;stars.appendChild(s)}
      const fl=document.getElementById('floaters');
      for(let i=0;i<30;i++){const h=document.createElement('span');h.className='fl '+(i%3===1?'blue':i%3===2?'violet':'');const size=16+Math.random()*38;h.style.width=h.style.height=size+'px';h.style.left=Math.random()*100+'%';h.style.animationDuration=(12+Math.random()*18)+'s';h.style.animationDelay=(-Math.random()*20)+'s';h.innerHTML=`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="${heart}"/></svg>`;fl.appendChild(h)}
    }
    function renderSteps(){
      const t=CONFIG.teks;
      stepsEl[0].innerHTML=`<div class="nivio">${CONFIG.namaKamu[0]}</div><span class="eyebrow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${heart}"/></svg>${t.introKecil}</span><h1>${t.introJudul}</h1><p class="typed"><span id="typeIntro"></span><span class="cursor"></span></p><div class="actions"><button class="btn btn-pink" data-go="1">${t.tombolLanjut} ${btnIcon}</button></div>`;
      stepsEl[1].innerHTML=`<span class="eyebrow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${heart}"/></svg>${t.siapKecil}</span><h1>${t.siapJudul}</h1><p>${t.siapIsi}</p><div class="actions"><button class="btn btn-blue" data-go="2">${t.tombolLanjut} ${btnIcon}</button></div>`;
      [2,3,4].forEach((n,idx)=>{stepsEl[n].innerHTML=`<div class="count">${idx+1}</div><h1>${t.hitung[idx]}</h1><p>Klik lanjut lagi ya, ini bagian ${idx+1} dari 3.</p><div class="actions"><button class="btn ${idx%2?'btn-blue':'btn-pink'}" data-go="${n+1}">${t.tombolLanjut} ${btnIcon}</button></div>`});
      stepsEl[5].innerHTML=`<span class="eyebrow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${heart}"/></svg>${t.confessKecil}</span><h1>${t.confessJudul}</h1><div class="long-note">${t.confessPanjang}</div><div class="choices"><button class="btn btn-pink" data-answer="yes">${t.tombolMau}</button><button class="btn btn-blue" data-answer="no">${t.tombolNgak}</button></div>`;
      document.getElementById('yesTitle').textContent=t.yesTitle;
      document.getElementById('yesText').textContent=t.yesText;
      document.getElementById('noTitle').textContent=t.noTitle;
      document.getElementById('noText').textContent=t.noText;
      document.getElementById('credit').textContent=t.kredit;
    }
    function showStep(i){stepsEl.forEach((s,idx)=>s.classList.toggle('active',idx===i));if(i===0)typeIntro();}
    function showFinal(kind){
      document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
      document.querySelector(`[data-final="${kind}"]`).classList.add('active');
      kirimNotifikasi(kind);
      startCelebration(kind);
    }
    function typeIntro(){if(typedIntro)return;typedIntro=true;const el=document.getElementById('typeIntro');let i=0;(function tick(){el.textContent=CONFIG.teks.introIsi.slice(0,i++);if(i<=CONFIG.teks.introIsi.length)setTimeout(tick,30)})();}
    function sparks(e){const r=card.getBoundingClientRect();for(let i=0;i<10;i++){const s=document.createElement('span');s.className='spark '+(i%2?'blue':'');s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';s.style.setProperty('--x',(Math.random()*120-60)+'px');s.style.setProperty('--y',(Math.random()*120-60)+'px');card.appendChild(s);setTimeout(()=>s.remove(),800)}}

    /* Notifikasi: butuh CONFIG.notifikasi.url yang menerima POST JSON. */
    function kirimNotifikasi(jawaban){
      if(!CONFIG.notifikasi.url) return;
      const payload={judul:CONFIG.notifikasi.judul,jawaban,namaDia:CONFIG.namaDia,dari:CONFIG.namaKamu,waktu:new Date().toLocaleString('id-ID'),link:location.href};
      fetch(CONFIG.notifikasi.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
    }

    /* Musik: pakai lagu.mp3 bila ada; jika tidak/gagal, pakai instrumental original. */
    function note(f,t,d=.34,v=.042){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+d+.05)}
    function startSynth(){audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();synthOn=true;const mel=[392,440,494,587,659,587,494,440,392,330,392,494];let s=0;(function tick(){if(!synthOn)return;const n=audioCtx.currentTime,f=mel[s%mel.length];note(f,n,.36,.042);note(f*2,n+.08,.22,.018);if(s%4===0)note(196,n,.7,.02);s++;synthTimer=setTimeout(tick,430)})();}
    function stopSynth(){synthOn=false;clearTimeout(synthTimer)}
    async function toggleMusic(){try{if(useFile){song.paused?await song.play():song.pause();}else{synthOn?stopSynth():startSynth();}}catch(e){useFile=false;song.pause();synthOn?stopSynth():startSynth();}const playing=useFile?!song.paused:synthOn;musicBtn.classList.toggle('off',!playing);musicBtn.setAttribute('aria-pressed',String(playing));musicLabel.textContent=playing?'Musik: on':CONFIG.teks.tombolMusik;}
    song.addEventListener('error',()=>useFile=false);
    song.addEventListener('play',()=>{musicBtn.classList.remove('off');musicLabel.textContent='Musik: on';musicBtn.setAttribute('aria-pressed','true')});
    song.addEventListener('pause',()=>{if(useFile){musicBtn.classList.add('off');musicLabel.textContent=CONFIG.teks.tombolMusik;musicBtn.setAttribute('aria-pressed','false')}});
    musicBtn.addEventListener('click',toggleMusic);

    /* Fireworks + bunga kembang api */
    const fx=document.getElementById('fx'),ctx=fx.getContext('2d');let W,H,parts=[],rockets=[];
    function resize(){W=fx.width=innerWidth;H=fx.height=innerHeight}addEventListener('resize',resize);resize();
    const colors=['#ff6fae','#ff9dc8','#69b7ff','#9fd6ff','#ffd166','#a58bff'];
    function launch(){rockets.push({x:Math.random()*W*.8+W*.1,y:H+10,vx:(Math.random()-.5)*2,vy:-(7+Math.random()*4),c:colors[Math.random()*colors.length|0]})}
    function explode(x,y,c,flower=false){const n=flower?90:80;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+(Math.random()-.2),sp=flower?2.1+Math.random()*1.2:2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.008+Math.random()*.012,c,r:flower?3.2:2.6,flower,a})}}
    function loop(){ctx.clearRect(0,0,W,H);rockets=rockets.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=.06;ctx.fillStyle=r.c;ctx.fillRect(r.x,r.y,3,8);if(r.vy>-1){explode(r.x,r.y,r.c,Math.random()<.35);return false}return true});parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life-=p.decay;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;if(p.flower){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a+p.life*5);ctx.beginPath();ctx.ellipse(0,0,p.r*2.2,p.r*.8,0,0,Math.PI*2);ctx.fill();ctx.restore();}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}return p.life>0});ctx.globalAlpha=1;if(celebrating)rafId=requestAnimationFrame(loop)}
    function startCelebration(kind){celebrating=true;cancelAnimationFrame(rafId);parts=[];rockets=[];loop();for(let i=0;i<6;i++)setTimeout(launch,i*120);if(kind==='yes')setTimeout(()=>explode(W/2,H*.34,'#ff6fae',true),650);}

    document.addEventListener('click',e=>{
      const go=e.target.closest('[data-go]');const ans=e.target.closest('[data-answer]');const rep=e.target.closest('[data-replay]');
      if(go){sparks(e);showStep(Number(go.dataset.go));}
      if(ans){sparks(e);showFinal(ans.dataset.answer);}
      if(rep){celebrating=false;cancelAnimationFrame(rafId);ctx.clearRect(0,0,W,H);showStep(0);}
    });

    decorate();renderSteps();showStep(0);
  </script>
</body>
